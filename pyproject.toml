[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "differential-experience-architecture"
version = "0.1.0"
description = "Reproducible computational tests for Differential Experience Architecture"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "matplotlib>=3.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
