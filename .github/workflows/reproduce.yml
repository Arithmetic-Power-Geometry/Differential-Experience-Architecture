name: Reproduce DEA validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Reproduce all experiments
        run: python scripts/run_all.py
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: dea-validation-artifact
          path: |
            results/
            figures/
